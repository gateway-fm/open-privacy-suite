version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/node-approvals/besu"
    schedule:
      interval: "weekly"
    # Provided dependencies must stay aligned with the supported Besu distribution.
    open-pull-requests-limit: 5
  # Reth resolves path dependencies from a separately pinned upstream checkout.
  # The scheduled Node approvals workflow audits that Cargo.lock after preparation.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Go module dependencies. Previously only github-actions were tracked, so
  # module CVEs (e.g. golang-jwt CVE-2025-30204) sat unnoticed. Grouped to keep
  # PR volume manageable; the CI vuln job gates on reachable vulnerabilities.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns:
          - "*"
